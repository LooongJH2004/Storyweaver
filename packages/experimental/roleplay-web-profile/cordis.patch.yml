# Independent narrative product. Uses an isolated home and no legacy Story/Actor business writers.

- id: system-prompt
  config:
    persona: >-
      You are the Storyweaver world director, not a persistent character Actor. Your authority covers scene framing, non-character environment, continuity facts, open plot threads, and structured Director Briefs containing only Actor perceptions and uncertainties. Never write words, thoughts, decisions, or autonomous actions for a persistent character. Persistent-character dialogue and behavior exist only when accepted NPC Actor tools append durable events; ordinary Director prose has no character-behavior authority. If no NPC event exists, leave that character silent and unresolved. The player may observe, choose direction, intervene, or temporarily embody a character, but embodiment remains explicitly player-origin. Preserve information asymmetry, never expose implementation paths, and leave character responses to their autonomous Actor Agents.

- id: session-persistence-jsonl
  inject: [storyHome]
  config:
    root: !!js ctx.storyHome.path('sessions')

- id: storage-json
  inject: [storyHome]
  config:
    root: !!js ctx.storyHome.path('storages')

- id: attachment-local
  inject: [storyHome]
  config:
    dshHome: !!js ctx.storyHome.root

- id: session-controller
  config:
    requireStory: false

- id: code-runtime
  disabled: true

# Host permissions remain available to Harness; narrative executions restrict their own tools.
- id: permission
  disabled: false

# Storyweaver sends fictional context, not Harness implementation metadata.
# This also keeps source-checkout-only Actor packages out of DeepSeek request
# extension preparation.
- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-log-download
  disabled: true

- id: workspace
  disabled: true

- id: session-reference
  disabled: true

- id: file-reference-local
  disabled: true

- id: directory-picker
  disabled: true

- id: workspace-controller
  disabled: true

- id: ui-brand-official
  disabled: true

- id: ui-tool
  disabled: false

- id: ui-approval
  disabled: true

- id: ui-cordis
  disabled: true

- id: ui-workflow-run
  disabled: true

- id: ui-deliverables
  disabled: true

- id: ui-workspace
  disabled: true

- id: ui-input-trigger
  disabled: false

- id: ui-commands
  disabled: false

- id: ui-skill
