- insert:
    - id: creation-directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: story-home
      name: '@deepseek-ai/dsh-story-home'
      config:
        root: !!js process.env.STORYWEAVER_INDEPENDENT_HOME ?? `${process.env.LOCALAPPDATA ?? process.env.XDG_DATA_HOME ?? process.env.HOME + '/.local/share'}/Storyweaver-independent-v1`

    - id: roleplay-services
      name: '@deepseek-ai/dsh-roleplay-services'
      inject: [storyHome]
      config:
        databasePath: !!js ctx.storyHome.path('storages') + '/narrative.sqlite'
        journalMode: wal
        busyTimeoutMs: 5000
        provider: deepseek-official
        model: deepseek-v4-flash
        characterLimits:
          maxCoreMemories: 64
          maxRecallResults: 8
          maxTextBytes: 16384
          maxSourceRefs: 16
          maxActiveGoals: 32
          maxScheduledIntentions: 32
        recallCharacterLimit: 24000
        queryPageLimit: 100
        directorCommandLimit: 24
        worldFeedbackLimit: 2
        reactiveDirectorLimit: 1
        consolidationThreshold: 16
        directorConsolidationThreshold: 16
        consolidationBatchLimit: 2
        discussionTurnLimit: 24
        maxContextUpdateUnits: 16
        notificationIntervalMs: 100

    - id: roleplay-controller
      name: '@deepseek-ai/dsh-api-roleplay-controller'
