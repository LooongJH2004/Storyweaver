- insert:
    # Creation mode needs explicit local-directory authorization, but not the
    # base directory picker's ui-workspace surfaces. Compose only the native
    # Host backend and this profile's narrow Remote bridge.
    - id: roleplay-directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: roleplay-directory-picker-controller
      name: '@deepseek-ai/dsh-experimental-roleplay-web-profile'

    - id: story-home
      name: '@deepseek-ai/dsh-story-home'

    - id: story-registry
      name: '@deepseek-ai/dsh-story'

    - id: story-controller
      name: '@deepseek-ai/dsh-api-story-controller'

    - id: actor
      name: '@deepseek-ai/dsh-experimental-actor'

    - id: tool-actor
      name: '@deepseek-ai/dsh-experimental-tool-actor'
      config:
        isolateGlobalTools: true

    - id: tool-director
      name: '@deepseek-ai/dsh-experimental-tool-director'
      config:
        actorPreset: storyweaver-actor
        directorRecentEventLimit: 64
        actorRecentPerceptionLimit: 32
        discussionRecentTurnLimit: 12

    - id: ui-story
      name: '@deepseek-ai/dsh-client-ui-story'

    - id: ui-roleplay
      name: '@deepseek-ai/dsh-experimental-client-ui-roleplay'
