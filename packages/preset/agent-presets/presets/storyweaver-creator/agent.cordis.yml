# Storybook creation workspace with a user-authorized local working directory.
# The creator plugin removes inherited tools, then this preset adds a local
# platform shell plus filesystem/search tools. These rows exist only in the
# Creator Agent realm; Story Director and Actor presets never receive them.

- id: creator-tools
  name: '@deepseek-ai/dsh-experimental-tool-director/creator'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: local-files
  name: '@deepseek-ai/dsh-tool-fs'

- id: local-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
